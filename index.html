<style>
  :root {
    color-scheme: light dark;
    --fondo: #f6f5f2;
    --superficie: #ffffff;
    --texto: #1c1b19;
    --texto-suave: #6b6660;
    --borde: #e7e3dc;
    --sombra: 0 1px 2px rgba(20,15,5,0.04), 0 8px 24px rgba(20,15,5,0.05);
    --acento: #b3541e;
    --acento-suave: #fdf1e8;
    --anillo: rgba(179,84,30,0.25);
    --radio: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #16140f;
      --superficie: #201d17;
      --texto: #f2efe9;
      --texto-suave: #a89f92;
      --borde: #343026;
      --sombra: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
      --acento: #e08a4b;
      --acento-suave: #2c2116;
      --anillo: rgba(224,138,75,0.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; background: var(--fondo); color: var(--texto);
    line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  .envoltura { max-width: 880px; margin: 0 auto; padding: 0 16px 64px; }

  /* Hero */
  .hero {
    background: linear-gradient(180deg, var(--acento-suave), var(--fondo) 85%);
    padding: 48px 16px 32px; text-align: center; border-bottom: 1px solid var(--borde);
  }
  .hero .marca {
    display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem;
    color: var(--acento); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    margin-bottom: 14px;
  }
  .hero h1 {
    font-size: clamp(1.8rem, 4vw, 2.4rem); font-weight: 800; margin: 0 0 10px;
    letter-spacing: -0.02em;
  }
  .hero p.subt {
    color: var(--texto-suave); font-size: 1.02rem; max-width: 520px; margin: 0 auto;
  }

  /* Controles */
  .controles-envoltura {
    position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--fondo) 88%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--borde);
  }
  .controles {
    max-width: 880px; margin: 0 auto; padding: 14px 16px;
    display: flex; gap: 10px; flex-wrap: wrap;
  }
